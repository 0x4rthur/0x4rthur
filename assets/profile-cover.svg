    <circle cx="1046" cy="180" r="4" fill="#22D3EE"/>
    <circle cx="976" cy="142" r="4" fill="#6366F1"/>
    <circle cx="906" cy="220" r="4" fill="#A3E635"/>
    <path d="M1046 180 L976 142 L906 220" stroke="#94A3B8" stroke-width="1.5"/>
